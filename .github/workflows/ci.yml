name: CI

on:
  push:
    branches: ["main", "te/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The runtime build (tools/build_p4c_t3.py) and the embedded-host tests require the
      # checkout's private .venv, exactly as on the owner's machine.
      - name: Create the private venv, install package and test dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e .[test]

      - name: Verify package version and resolved path
        run: |
          .venv\Scripts\python.exe -m trade_engine --version

      - name: Run local CI gate
        run: |
          .venv\Scripts\python.exe tools/ci_local.py --include-uncommitted
