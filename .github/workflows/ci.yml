name: CI

on:
  push:
    branches: ["main", "te/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Verify package version and resolved path
        run: |
          python -m trade_engine --version

      - name: Run local CI gate
        run: |
          python tools/ci_local.py --include-uncommitted
