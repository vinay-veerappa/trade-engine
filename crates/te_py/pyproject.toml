# Its own distribution, so `maturin develop` never reads the repo-root
# pyproject.toml and replaces the `trade-engine` editable install with this.
[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "trade-engine-rs"
version = "0.1.0"
requires-python = ">=3.13"

[tool.maturin]
module-name = "trade_engine_rs"
