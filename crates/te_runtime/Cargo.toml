[package]
name = "te_runtime"
version = "0.1.0"
edition = "2021"
description = "Opt-in embedded CPython packaging proof; not a trading job owner."
license = "MIT"

[[bin]]
name = "te"
path = "src/main.rs"

[dependencies]
trade_engine_rs = { package = "te_py", path = "../te_py", default-features = false, features = ["embed"] }
pyo3 = { version = "=0.23.5" }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
pyo3-build-config = { version = "=0.23.5", features = ["resolve-config"] }
