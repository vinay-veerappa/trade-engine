[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-engine"
version = "0.1.0"
description = "Generic event-sourced trading engine"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Vinay Veerappa"}
]
# The exchange calendar is Rust now (trade_engine_rs, built from crates/te_py by
# tools/ci_local.py); exchange-calendars stays as its test-only oracle. Greeks and
# implied vol are Rust too (te_core::greeks); vollib is that module's test-only oracle.
# zoneinfo has no system tz database on Windows: without tzdata, ExchangeCalendar() raises.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "exchange-calendars>=4.5",
    "vollib>=1.0.11,<2",
    "maturin>=1.5,<2",
]

[project.scripts]
trade_engine = "trade_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
