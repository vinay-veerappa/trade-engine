[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-engine"
version = "0.1.0"
description = "Generic event-sourced trading engine"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Vinay Veerappa"}
]
dependencies = [
    "exchange-calendars>=4.5",
    "vollib>=1.0.11,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
trade_engine = "trade_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
